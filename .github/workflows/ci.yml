# 双系统测试与构建（BB六合彩 + 双色球）
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Compile check（语法/导入级编译）
        run: python -m compileall -q app bb_analysis web bb_v9.py bb_sync.py tests

      - name: Static check（仅错误类规则，不设风格门槛）
        run: ruff check --select E9,F63,F7,F82,F821 app bb_analysis web tests

      - name: Secret scan（历史与工作区不得出现疑似密钥）
        run: |
          python - <<'PY'
          import pathlib, re, sys
          pat = re.compile(r"(tp|sk)-[A-Za-z0-9]{20,}")
          bad = []
          for p in list(pathlib.Path(".").rglob("*.py")) + list(pathlib.Path(".").rglob("*.md")):
              if ".git" in p.parts or "reference" in p.parts:
                  continue
              try:
                  if pat.search(p.read_text(encoding="utf-8", errors="ignore")):
                      bad.append(str(p))
              except OSError:
                  pass
          if bad:
              print("疑似密钥文件:", bad); sys.exit(1)
          print("secret scan clean")
          PY

      - name: Prepare BB data（幂等导入 + 走期回测，供依赖数据库的测试）
        run: |
          python -m bb_analysis import
          python -m bb_analysis backtest

      - name: Run tests（真实测试套件）
        run: python -m pytest tests/ -q
